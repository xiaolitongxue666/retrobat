# 8BitDo Ultimate 2.4G, rear switch on D (DirectInput).
# libretro retroarch-joypad-autoconfig dinput profile, firmware v1.08.
# Product 12307 is that profile. This machine's pad is 2dc8:3012 (12306).
# config.bash copies this file, and when that pad is connected writes
# 8BitDo_Ultimate_wireless_Controller_alt.cfg with the 32-character
# Bluetooth Wireless Controller name plus 11720/12306. The bundled F30
# profile matches the Bluetooth name at affinity 20 and would win a tie.
# Right stick Y is axis 5. The udev profile uses axis 3; do not copy that.
# Buttons 2 and 5 are unused. Star, the profile button, and P1/P2 have no
# index in that profile.

input_driver = "dinput"
input_device = "8BitDo Ultimate wireless Controller for PC"
input_device_display_name = "8BitDo Ultimate 2.4g Controller"

input_vendor_id = "11720"
input_product_id = "12307"

input_b_btn = "0"
input_y_btn = "3"
input_select_btn = "10"
input_start_btn = "11"
input_a_btn = "1"
input_x_btn = "4"
input_l_btn = "6"
input_r_btn = "7"
input_l2_btn = "8"
input_r2_btn = "9"
input_l3_btn = "13"
input_r3_btn = "14"
input_menu_toggle_btn = "12"

input_up_btn = "h0up"
input_down_btn = "h0down"
input_left_btn = "h0left"
input_right_btn = "h0right"

input_l_x_plus_axis = "+0"
input_l_x_minus_axis = "-0"
input_l_y_plus_axis = "+1"
input_l_y_minus_axis = "-1"
input_r_x_plus_axis = "+2"
input_r_x_minus_axis = "-2"
input_r_y_plus_axis = "+5"
input_r_y_minus_axis = "-5"

input_b_btn_label = "A"
input_y_btn_label = "X"
input_select_btn_label = "View"
input_start_btn_label = "Menu"
input_a_btn_label = "B"
input_x_btn_label = "Y"
input_l_btn_label = "LB"
input_r_btn_label = "RB"
input_l2_btn_label = "LT"
input_r2_btn_label = "RT"
input_l3_btn_label = "LSB"
input_r3_btn_label = "RSB"
input_menu_toggle_btn_label = "Home"

input_up_btn_label = "Dpad Up"
input_down_btn_label = "Dpad Down"
input_left_btn_label = "Dpad Left"
input_right_btn_label = "Dpad Right"

input_l_x_plus_axis_label = "LS Right"
input_l_x_minus_axis_label = "LS Left"
input_l_y_plus_axis_label = "LS Down"
input_l_y_minus_axis_label = "LS Up"
input_r_x_plus_axis_label = "RS Right"
input_r_x_minus_axis_label = "RS Left"
input_r_y_plus_axis_label = "RS Down"
input_r_y_minus_axis_label = "RS Up"
